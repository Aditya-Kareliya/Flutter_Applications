name: "Portfolio Creativity Build"

# ✅ REQUIRED FOR RELEASE CREATION AND DEPLOYMENT
permissions:
  contents: write

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      run_build:
        description: "Force build?"
        required: false
        default: "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUB_CACHE: ~/.pub-cache

jobs:

  # =========================
  # 🛡️ LINT & TEST CI JOB
  # =========================
  lint-and-test:
    name: "🛡️ Lint & Test"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Format Check (Non-blocking)
        run: dart format --output=none .

      - name: 🧪 Run Analysis
        run: flutter analyze

      - name: 🧪 Run Tests
        run: flutter test

  # =========================
  # 📱 ANDROID BUILD
  # =========================
  android-build:
    name: "📱 Android APK"
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.run_build == 'true'

    outputs:
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 🔥 EXTRACT VERSION FROM pubspec.yaml
      - name: 📦 Extract Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2)
          VERSION_NAME=$(echo $VERSION | cut -d '+' -f1)
          BUILD_NUMBER=$(echo $VERSION | cut -d '+' -f2)
          
          echo "VERSION_NAME=$VERSION_NAME"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: ☕ Setup Java & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build APK
        run: flutter build apk --release

      # 🔍 Debug (helps avoid path issues)
      - name: 🔍 Check APK
        run: ls build/app/outputs/flutter-apk/

      - name: 🔥 Install Firebase CLI
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != '' }}
        run: npm install -g firebase-tools

      - name: 🚀 Distribute APK to Firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != '' }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
          --app ${{ env.FIREBASE_APP_ID }} \
          --token ${{ env.FIREBASE_TOKEN }} \
          --groups "qa-team" \
          --release-notes "New build from GitHub Actions"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*

  # =========================
  # 🍎 IOS BUILD
  # =========================
  ios-build:
    name: "🍎 iOS IPA"
    runs-on: macos-latest

    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.run_build == 'true'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build iOS
        run: flutter build ios --no-codesign

      - name: 📦 Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r app.ipa Payload

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/app.ipa

  # =========================
  # 🚀 CREATE RELEASE
  # =========================
  create-release:
    name: "🚀 Create Release"
    needs: [android-build, ios-build]
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.run_build == 'true'

    steps:
      - name: 📥 Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: 📥 Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android-build.outputs.version_name }}
          name: Release v${{ needs.android-build.outputs.version_name }}
          draft: false
          prerelease: false
          allowUpdates: true
          files: |
            artifacts/android/*
            artifacts/ios/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

  # =========================
  # 🌐 WEB BUILD & DEPLOY
  # =========================
  web-build-deploy:
    name: "🌐 Web Build & Deploy"
    needs: create-release
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.inputs.run_build == 'true'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web
        run: flutter build web --release

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: 🔥 Install Firebase CLI
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: npm install -g firebase-tools

      - name: 🚀 Deploy Web to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.FIREBASE_TOKEN != '' }}
        run: |
          firebase deploy --only hosting --token ${{ env.FIREBASE_TOKEN }}
