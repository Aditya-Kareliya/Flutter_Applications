name: "Pavan Putra Garbi — Web Build & Deploy"

permissions:
  contents: write
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - master
      - develop
      - pavan_putra_garbi_mandal
      - pavanputragarbimandal
  pull_request:
    branches:
      - main
      - master
      - pavan_putra_garbi_mandal
      - pavanputragarbimandal
  workflow_dispatch:
    inputs:
      run_build:
        description: "Force web build & release?"
        required: false
        default: "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUB_CACHE: ~/.pub-cache

jobs:

  # =========================================================================
  # 📦 EXTRACT VERSION FROM pubspec.yaml
  # =========================================================================
  version:
    name: "📦 Extract Version"
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
      build_number: ${{ steps.version.outputs.BUILD_NUMBER }}
      full_version: ${{ steps.version.outputs.FULL_VERSION }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Parse Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2 | tr -d '\r' | tr -d '"' | tr -d "'")
          VERSION_NAME=$(echo $VERSION | cut -d '+' -f1)
          BUILD_NUMBER=$(echo $VERSION | cut -d '+' -f2)

          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "$VERSION_NAME" ]; then
            BUILD_NUMBER="1"
          fi

          echo "=========================================================="
          echo "PARSED VERSION: $VERSION"
          echo "VERSION_NAME:   $VERSION_NAME"
          echo "BUILD_NUMBER:   $BUILD_NUMBER"
          echo "=========================================================="

          echo "FULL_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT


  # =========================================================================
  # 🔍 CODE QUALITY & STATIC ANALYSIS
  # =========================================================================
  code-quality:
    name: "🔍 Code Quality & Static Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ⚡ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧐 Run Static Analysis
        run: flutter analyze

      - name: 🧪 Run Tests (if test suite exists)
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test suite found; skipping flutter test."
          fi


  # =========================================================================
  # 🌐 WEB BUILD & FIREBASE DEPLOYMENT
  # =========================================================================
  web-build:
    name: "🌐 Web Build & Firebase Deploy"
    needs: [ version, code-quality ]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ⚡ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web Release
        run: |
          echo "Building Web release for Version: ${{ needs.version.outputs.version_name }} (Build ${{ needs.version.outputs.build_number }})..."
          flutter build web --release --no-tree-shake-icons \
            --build-name="${{ needs.version.outputs.version_name }}" \
            --build-number="${{ needs.version.outputs.build_number }}"

      - name: 📦 Package Web Artifact (ZIP)
        run: |
          mkdir -p artifacts/web
          cd build/web
          zip -r "../../artifacts/web/pavan-putra-garbi-web-v${{ needs.version.outputs.version_name }}-b${{ needs.version.outputs.build_number }}.zip" .
          cd ../..

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: artifacts/web/*.zip

      - name: ⚡ Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🚀 Deploy to Firebase (Hosting, Firestore & Storage)
        if: |
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/pavan_putra_garbi_mandal' ||
          github.ref == 'refs/heads/pavanputragarbimandal' ||
          github.event.inputs.run_build == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PAVANPUTRAGARBI }}
        run: |
          echo "=========================================================="
          echo " Deploying Version ${{ needs.version.outputs.version_name }}+${{ needs.version.outputs.build_number }} to Firebase"
          echo " Target Project: pavanputragarbi "
          echo "=========================================================="

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "🔑 Using Google Cloud Service Account credentials..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_service_account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase_service_account.json"
            firebase deploy --project pavanputragarbi --only hosting,firestore:rules,firestore:indexes,storage --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "🔑 Using Firebase CI Token credentials..."
            firebase deploy --project pavanputragarbi --only hosting,firestore:rules,firestore:indexes,storage --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "⚠️ Notice: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret configured. Skipping automated Firebase deployment."
          fi


  # =========================================================================
  # 🚀 CREATE GITHUB RELEASE
  # =========================================================================
  create-release:
    name: "🚀 Create GitHub Release"
    needs: [ version, web-build ]
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '#build') ||
      github.event.inputs.run_build == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/pavan_putra_garbi_mandal' ||
      github.ref == 'refs/heads/pavanputragarbimandal'

    steps:
      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release-bundle
          path: artifacts/web

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version_name }}+${{ needs.version.outputs.build_number }}
          name: Release v${{ needs.version.outputs.version_name }} (Build ${{ needs.version.outputs.build_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/web/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
