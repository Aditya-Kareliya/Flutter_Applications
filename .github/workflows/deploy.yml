name: Production CI/CD — Pavan Putra Garbi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: CODE QUALITY, LINTING & STATIC ANALYSIS
  # =========================================================================
  code_quality_check:
    name: 🔍 Code Quality & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Set up Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: 📦 Download & Resolve Project Dependencies
        run: |
          echo "Fetching Flutter & Dart dependencies..."
          flutter pub get

      - name: 🧐 Run Flutter Static Code Analysis
        run: |
          echo "Running strict static analysis (flutter analyze)..."
          flutter analyze --fatal-infos --fatal-warnings

  # =========================================================================
  # JOB 2: PRODUCTION BUILD & FIREBASE DEPLOYMENT
  # =========================================================================
  build_and_deploy:
    name: 🚀 Production Build & Firebase Deployment
    needs: code_quality_check
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 💙 Set up Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: 📦 Download & Resolve Project Dependencies
        run: |
          flutter pub get

      - name: 🏗️ Compile Production Web Release
        run: |
          echo "Compiling Flutter Web application with release optimizations..."
          flutter build web --release --no-tree-shake-icons

      - name: ⚡ Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false

      - name: 🔥 Install Firebase CLI Tools
        run: |
          echo "Installing latest firebase-tools CLI..."
          npm install -g firebase-tools

      - name: 🚀 Deploy Web App, Firestore Rules & Storage to Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_PAVANPUTRAGARBI }}
        run: |
          echo "=========================================================="
          echo " Starting Automated Deployment to Firebase "
          echo " Target Project: pavanputragarbi "
          echo "=========================================================="

          # Verify build/web output exists
          if [ ! -d "build/web" ] || [ ! -f "build/web/index.html" ]; then
            echo "❌ Error: build/web artifact not found or incomplete!"
            exit 1
          fi

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "🔑 Using Google Cloud Service Account credentials..."
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase_service_account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase_service_account.json"
            firebase deploy --project pavanputragarbi --only hosting,firestore:rules,firestore:indexes,storage --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "🔑 Using Firebase CI Token credentials..."
            firebase deploy --project pavanputragarbi --only hosting,firestore:rules,firestore:indexes,storage --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "❌ ERROR: Missing Firebase deployment credentials!"
            echo "Please add one of the following secrets in GitHub Repository Settings -> Secrets and variables -> Actions:"
            echo "  1. FIREBASE_SERVICE_ACCOUNT (Recommended: Google Cloud Service Account JSON Key)"
            echo "  2. FIREBASE_TOKEN (Legacy: Generated via 'firebase login:ci')"
            exit 1
          fi

          echo "=========================================================="
          echo "🎉 Production Deployment Succeeded!"
          echo "🌐 Firebase Hosting: https://pavanputragarbi.web.app"
          echo "🌐 Custom Domain:    https://pavanputragarbi.firebaseapp.com"
          echo "=========================================================="
