name: "Pavan Putra Garbi — Web Build & Deploy"

permissions:
  contents: write
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - main
      - master
      - develop
      - pavan_putra_garbi_mandal

  pull_request:
    branches:
      - main
      - master
      - pavan_putra_garbi_mandal
      
  workflow_dispatch:
    inputs:
      run_build:
        description: "Force build and release?"
        required: true
        type: boolean
        default: false

env:
  PUB_CACHE: ~/.pub-cache
  FIREBASE_PROJECT_ID: pavanputragarbi

concurrency:
  group: pavan-putra-garbi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # =========================================================================
  # 1. 📦 EXTRACT VERSION FROM pubspec.yaml
  # =========================================================================
  version:
    name: "📦 Extract Version"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Parse Version from pubspec.yaml
        id: version
        shell: bash
        run: |
          set -euo pipefail

          FULL_VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f2 | tr -d '\r' | tr -d '"' | tr -d "'")

          VERSION_NAME="${FULL_VERSION%%+*}"
          if [[ "$FULL_VERSION" == *"+"* ]]; then
            BUILD_NUMBER="${FULL_VERSION#*+}"
          else
            BUILD_NUMBER="1"
          fi

          if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "$VERSION_NAME" ]; then
            BUILD_NUMBER="1"
          fi

          echo "=========================================================="
          echo "PARSED VERSION: $FULL_VERSION"
          echo "VERSION_NAME:   $VERSION_NAME"
          echo "BUILD_NUMBER:   $BUILD_NUMBER"
          echo "=========================================================="

          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"


  # =========================================================================
  # 2. 🔍 CODE QUALITY & STATIC ANALYSIS
  # =========================================================================
  code-quality:
    name: "🔍 Code Quality & Static Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ⚡ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🧐 Run Static Analysis
        run: flutter analyze


  # =========================================================================
  # 3. 🌐 WEB BUILD & FIREBASE DEPLOYMENT
  # =========================================================================
  web-build:
    name: "🌐 Web Build & Firebase Deploy"
    needs: [ version, code-quality ]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: |
      contains(github.event.head_commit.message, '#build') ||
      inputs.run_build == true ||
      inputs.run_build == 'true' ||
      github.event.inputs.run_build == true ||
      github.event.inputs.run_build == 'true'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: ⚡ Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🏗️ Build Web Release
        run: |
          echo "Building Web release for Version: ${{ needs.version.outputs.version_name }} (Build ${{ needs.version.outputs.build_number }})..."
          flutter build web --release --no-tree-shake-icons \
            --build-name="${{ needs.version.outputs.version_name }}" \
            --build-number="${{ needs.version.outputs.build_number }}"

      - name: 📦 Package Web Artifact (ZIP)
        run: |
          mkdir -p artifacts/web
          cd build/web
          zip -r "../../artifacts/web/pavan-putra-garbi-web-v${{ needs.version.outputs.version_name }}-b${{ needs.version.outputs.build_number }}.zip" .
          cd ../..

      - name: 📤 Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: artifacts/web/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: ⚡ Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🚀 Deploy Web App & Firestore Rules to Firebase
        env:
          FIREBASE_TOKEN_PAVAN_PUTRA_GARBI_MANDAL: ${{ secrets.FIREBASE_TOKEN_PAVAN_PUTRA_GARBI_MANDAL }}
        run: |
          echo "=========================================================="
          echo " Deploying Version ${{ needs.version.outputs.version_name }}+${{ needs.version.outputs.build_number }} to Firebase"
          echo " Target Project: $FIREBASE_PROJECT_ID"
          echo "=========================================================="

          if [ -n "$FIREBASE_TOKEN_PAVAN_PUTRA_GARBI_MANDAL" ]; then
            echo "🔑 Deploying using FIREBASE_TOKEN_PAVAN_PUTRA_GARBI_MANDAL..."
            firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN_PAVAN_PUTRA_GARBI_MANDAL" --non-interactive
          else
            echo "⚠️ Notice: FIREBASE_TOKEN_PAVAN_PUTRA_GARBI_MANDAL secret not found in GitHub Secrets. Skipping automated deploy."
          fi


  # =========================================================================
  # 4. 🚀 CREATE GITHUB RELEASE
  # =========================================================================
  create-release:
    name: "🚀 Create GitHub Release"
    needs: [ version, web-build ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: |
      contains(github.event.head_commit.message, '#build') ||
      inputs.run_build == true ||
      inputs.run_build == 'true' ||
      github.event.inputs.run_build == true ||
      github.event.inputs.run_build == 'true'

    steps:
      - name: 📥 Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-release-bundle
          path: artifacts/web

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version_name }}+${{ needs.version.outputs.build_number }}
          name: Release v${{ needs.version.outputs.version_name }} (Build ${{ needs.version.outputs.build_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/web/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
