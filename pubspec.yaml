name: pavan_putra_garbi
publish_to: none
description: "Official heritage web portal and administrative management platform for Pavan Putra Garbi Mandal, Rajkot. Features bilingual Gujarati-English cultural showcase, real-time live preview CMS, multi-year archive, devotional offerings & UPI integration, and secure Firebase Cloud backend."
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  cached_network_image: ^3.4.1
  google_fonts: ^9.0.0
  sizer: ^3.1.3
  get_it: ^9.3.0
  shimmer: ^4.0.0
  equatable: ^2.0.7
  toastification: ^3.2.0
  image_picker: ^1.2.4
  carousel_slider: ^5.1.2
  http: ^1.6.0
  google_mlkit_translation: ^0.15.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/pavan_putra_logo.jpg
    - assets/images/pavan_putra_logo.png
